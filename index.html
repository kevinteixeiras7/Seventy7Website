.site-header{height:94px;gap:28px;border-top:4px solid var(--red);border-bottom:1px solid #0b070625;padding-left:calc(var(--pad) - 23px);box-shadow:0 5px 25px #0b070606}

.studio-split{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:0}

.split-label{position:absolute;bottom:48px;left:var(--pad);right:20px;z-index:2;display:flex;flex-direction:column;gap:12px}.split-label .mono{font-size:11px;display:flex;flex-wrap:wrap;gap:12px 22px}.split-discipline{font-size:clamp(16px,2vw,30px);letter-spacing:-.025em}.based-pill{position:absolute;right:var(--pad);top:22%;z-index:2;border:1px solid #f1ece2a0;border-radius:30px;padding:12px 17px;opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none}.studio-half:hover .based-pill,.studio-half:focus-visible .based-pill{opacity:1;transform:none}

/* Persistent landing gate. Both the document and underlay stay locked until selection. */
html{scrollbar-gutter:stable}html.gate-pending,html.gate-pending body{overflow:hidden!important;overscroll-behavior:none}

/* Cold Weather uses the shared work-tile image, caption and hover treatment. */
.tile-coldweather{grid-column:1/-1;grid-row:4;aspect-ratio:1.8}
.coldweather-category{display:inline-block;border:1px solid currentColor;border-radius:30px;padding:4px 9px}
.coldweather-client{display:block;margin-top:12px}

/* Updated work index: a full-width landscape film, followed by paired stories. */
.work-bento{grid-template-columns:repeat(2,minmax(0,1fr))}
.work-bento .tile-match{grid-column:1/-1;grid-row:1;aspect-ratio:16/9;align-self:stretch}

.work-bento .tile-oner{grid-column:2;grid-row:2;aspect-ratio:auto;align-self:stretch}
.work-bento .tile-film{grid-column:1;grid-row:3;aspect-ratio:3/4}

.work-bento .tile-aspinal{grid-column:1/-1;grid-row:4;aspect-ratio:2/1}
.work-tile:hover>video{transform:scale(1.035)}
.work-tile>.tile-hover-media,.tile-supporting-media{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;transition:opacity .3s}
.work-tile:hover>.tile-hover-media,.work-tile:focus-visible>.tile-hover-media,.tile-film:hover .tile-supporting-media,.tile-film:focus-within .tile-supporting-media{opacity:1}
.tile-supporting-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile-supporting-media img:last-child{opacity:0}
.tile-film:hover .tile-supporting-media img:last-child,.tile-film:focus-within .tile-supporting-media img:last-child{animation:summer-frames 4s steps(1,end) infinite}
@keyframes summer-frames{0%,49%{opacity:0}50%,100%{opacity:1}}

.site-header .brand img{display:block;width:100%;height:auto;max-height:68px;object-fit:contain;transform:none}

function setupMotion(){
  mediaObserver?.disconnect();

  }),{threshold:.3});
  view.querySelectorAll('.motion-video').forEach(video=>{
    const button=video.parentElement.querySelector('[data-motion-toggle]');
    if(!button){if(reducedMotion.matches)video.pause();mediaObserver.observe(video);return;}
    const update=()=>{button.textContent=video.paused?'Play preview':'Pause preview';button.setAttribute('aria-label',button.textContent);};

    button.addEventListener('click',()=>{if(video.paused){video.dataset.paused='false';video.play().catch(()=>{});}else{video.dataset.paused='true';video.pause();}});
    mediaObserver.observe(video);
  });
}

   <div class="split-label"><span class="mono">01 / LONDON <time class="studio-time"></time></span><span class="split-discipline">Creative production</span></div>
  </a>
  <a class="studio-half split-manchester" href="#manchester" data-enter-studio="manchester" aria-label="Enter Manchester marketing and communications">
   ${img('oner-06.jpg','An editorial archive of imagery and notes','split-photo',true)}
   <div class="split-label"><span class="mono">02 / MANCHESTER <time class="studio-time"></time></span><span class="split-discipline">Marketing & communications</span></div>
  </a>
 </div>
 <h1 id="gate-title" class="opening-accessible-title">Seventy7 — London and Manchester</h1>
 <div class="opening-curtain" aria-hidden="true">
  <div class="impact-door impact-left"><div class="impact-type"><span>7</span><span>7</span></div></div>
  <div class="impact-door impact-right"><div class="impact-type"><span>7</span><span>7</span></div></div>
  <div class="flash-reel"></div><div class="reel-white-flash"></div>
 </div>
 <button class="opening-skip mono" type="button">Skip intro ↗</button>
</section>`;}

// Real root opening. Eight shots, 90→60ms holds, each followed by a 25ms pure-white frame.
// Reel: 0.80s. Black/impact/hold/split: 1.6725s. Total: 2.4725s, after media decode.
function setupOpening(){
 if(gateStarted)return;gateStarted=true;
 if(!document.documentElement.classList.contains('gate-pending'))return;
 const container=document.createElement('div');container.innerHTML=landingGateMarkup();const hero=container.firstElementChild;document.body.append(hero);
 const underlying=[document.querySelector('.site-header'),document.querySelector('#main'),document.querySelector('#site-footer'),document.querySelector('.skip-link')];underlying.forEach(el=>el.inert=true);
 const header=document.querySelector('.site-header');
 const curtain=hero.querySelector('.opening-curtain');
 const reel=hero.querySelector('.flash-reel');
 const skip=hero.querySelector('.opening-skip');
 const finalLayer=hero.querySelector('.studio-split');
 const whiteFlash=hero.querySelector('.reel-white-flash');
 let cancelled=false,timeline=null,finished=false,clock=null,timeout=null;
 const files=['tiro-01.jpg','oner-01.jpg','matchday-07.jpg','oner-03.jpg','tiro-02.jpg','oner-02.jpg','matchday-01.jpg','tiro-03.jpg'];
 const updateClock=()=>{const now=new Date();hero.querySelectorAll('.studio-time').forEach(el=>{el.textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(now);el.dateTime=now.toISOString();});};updateClock();clock=setInterval(updateClock,1000);
 const settle=()=>{
  if(cancelled||finished)return;finished=true;timeline?.kill();clearTimeout(timeout);curtain.remove();skip.remove();finalLayer.inert=false;hero.classList.add('opening-ready');hero.dataset.openingPhase='awaiting-choice';document.body.classList.remove('opening-playing');
  hero.querySelector('[data-enter-studio]').focus({preventScroll:true});
 };
 skip.addEventListener('click',settle);
 const preferenceChanged=()=>{if(reducedMotion.matches)settle();};reducedMotion.addEventListener('change',preferenceChanged);
 const visibilityChanged=()=>{if(document.hidden&&!finished)settle();};document.addEventListener('visibilitychange',visibilityChanged);
 const trapFocus=event=>{
  if(event.key==='Escape'){event.preventDefault();settle();return;}
  if(event.key!=='Tab')return;
  const targets=finished?[...hero.querySelectorAll('[data-enter-studio]')]:[skip];
  const index=targets.indexOf(document.activeElement);
  if(event.shiftKey&&(index<=0)){event.preventDefault();targets[targets.length-1].focus();}
  else if(!event.shiftKey&&(index===targets.length-1||index<0)){event.preventDefault();targets[0].focus();}
 };hero.addEventListener('keydown',trapFocus);
 let exiting=false;
 const enterStudio=event=>{
  const link=event.target.closest('[data-enter-studio]');if(!link)return;event.preventDefault();event.stopPropagation();
  if(!finished||exiting)return;exiting=true;finalLayer.inert=true;
  const city=link.dataset.enterStudio;document.body.dataset.selectedStudio=city;
  // Render the chosen location behind the still-locked gate before revealing it.
  history.replaceState(null,'','#'+city);route();window.scrollTo({top:0,behavior:'instant'});
  document.documentElement.classList.add('gate-exiting');hero.dataset.openingPhase='exiting';
  const complete=()=>{
   if(cancelled)return;cancelled=true;clearInterval(clock);clearTimeout(timeout);
   reducedMotion.removeEventListener('change',preferenceChanged);document.removeEventListener('visibilitychange',visibilityChanged);
   hero.removeEventListener('keydown',trapFocus);hero.remove();underlying.forEach(el=>el.inert=false);
   document.documentElement.classList.remove('gate-pending','gate-exiting');document.body.classList.remove('opening-playing');
   try{sessionStorage.setItem('seventy7-gate-entered','1');}catch{}
   window.scrollTo({top:0,behavior:'instant'});view.querySelector('h1')?.focus({preventScroll:true});setupMotion();
  };
  if(reducedMotion.matches||!window.gsap){complete();return;}
  window.gsap.timeline({onComplete:complete})
   .to(hero.querySelector('.split-london'),{xPercent:-100,duration:.6,ease:'power3.inOut'},0)
   .to(hero.querySelector('.split-manchester'),{xPercent:100,duration:.6,ease:'power3.inOut'},0);
 };hero.addEventListener('click',enterStudio);
 skip.focus({preventScroll:true});
 if(reducedMotion.matches||!window.gsap){settle();return;}
 document.body.classList.add('opening-playing');header.inert=true;finalLayer.inert=true;
 timeout=setTimeout(settle,8000); // Failure recovery only; no animation timings are driven by timers.
 const preload=file=>new Promise(resolve=>{const image=new Image();image.alt='';image.decoding='async';image.onload=async()=>{try{await image.decode();resolve(image);}catch{resolve(null);}};image.onerror=()=>resolve(null);image.src=imageURL(file);});
 Promise.all([Promise.all(files.map(preload)),preload('oner-06.jpg'),document.fonts.load('400 120px Anton')]).then(([frames,manchester])=>{
  if(cancelled||finished)return;
  if(frames.some(frame=>!frame)||!manchester||reducedMotion.matches){settle();return;}
  clearTimeout(timeout);frames.forEach(frame=>reel.append(frame));
  const gs=window.gsap;gs.set(frames,{visibility:'hidden'});gs.set(hero.querySelectorAll('.impact-type'),{scale:1.3,visibility:'hidden'});
  const changePhase=phase=>hero.dataset.openingPhase=phase;
  timeline=gs.timeline({paused:true,onComplete:settle});
  timeline.call(()=>changePhase('reel'),[],0);
  let position=0;const order=[0,1,2,3,4,5,6,7];
  order.forEach((index,i)=>{
   timeline.set(whiteFlash,{visibility:'hidden'},position);
   timeline.set(frames,{visibility:'hidden'},position);
   timeline.set(frames[index],{visibility:'visible'},position);
   position+=.09-(.03*i/(order.length-1));
   timeline.set(whiteFlash,{visibility:'visible'},position);
   position+=.025;
  });
  timeline.set(whiteFlash,{visibility:'hidden'},position);
  const impact=position+.04,split=impact+.32+.5;
  timeline.set(reel,{display:'none'},position).call(()=>changePhase('impact'),[],position);
  timeline.set(hero.querySelectorAll('.impact-type'),{visibility:'visible'},impact);
  timeline.to(hero.querySelectorAll('.impact-type'),{scale:.97,duration:.19,ease:'power4.in'},impact);
  timeline.to(hero.querySelectorAll('.impact-type'),{scale:1,duration:.13,ease:'power2.out'},impact+.19);
  // One-frame chromatic displacement on the landing, without a full white-screen flash.
  timeline.set(hero.querySelectorAll('.impact-type'),{textShadow:'-7px 0 #FF2E12,7px 0 #F2A11B'},impact+.19);
  timeline.set(hero.querySelectorAll('.impact-type'),{textShadow:'none'},impact+.19+1/60);
  timeline.call(()=>changePhase('split'),[],split);
  timeline.to(hero.querySelector('.impact-left'),{xPercent:-100,duration:.8125,ease:'power3.inOut'},split);
  timeline.to(hero.querySelector('.impact-right'),{xPercent:100,duration:.8125,ease:'power3.inOut'},split);

  hero.dataset.openingDuration=timeline.duration().toFixed(2);timeline.play(0);
 }).catch(settle);
}

</script>
